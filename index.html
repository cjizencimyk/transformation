<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transformation">
<meta name="theme-color" content="#09100C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Transformation</title>
<style>
/* Monde unique : nuit de sous-bois, verre liquide, formes organiques.
   Mise en page : une colonne mobile, barre d'onglets flottante, feuilles qui montent du bas. */
:root{
  --ink:#09100C; --moss:#13241B; --lime:#D6F46C; --peach:#FF9E78; --aqua:#62E3CF; --lilac:#A99DFF;
  --text:#F3F7F0; --mute:#AAB8AF; --line:rgba(255,255,255,.16);
  --display:'Fraunces',Georgia,serif; --body:'Figtree',system-ui,sans-serif;
  --glass:linear-gradient(140deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 55%,rgba(255,255,255,.09));
  --ease:cubic-bezier(.2,.9,.25,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@font-face{font-family:'Fraunces';src:url(fonts/fraunces-latin-full-normal.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url(fonts/figtree-latin-wght-normal.woff2) format('woff2');font-weight:300 900;font-style:normal;font-display:swap}

/* Animations des exercices */
.anim{display:block;width:100%;height:auto}
.anim .bn{fill:url(#gBody)} .anim .bf{fill:url(#gFar)} .anim .mn{fill:url(#gMus);filter:drop-shadow(0 0 4px rgba(214,244,108,.5))} .anim .mf{fill:#6B9A22}
.anim .dbp{fill:url(#gPlate)} .anim .dbh{fill:#d9ded7} .anim .prop rect,.anim .prop circle{fill:#26302A} .anim .shadow{fill:url(#gShadow)}
.anim .ghost{opacity:.13} .anim .ghost path,.anim .ghost circle{fill:#e8f5d2;filter:none}
.anim .cue{fill:var(--lime);font-family:var(--display);font-weight:700;letter-spacing:-.01em} .anim .cue-trk{fill:rgba(255,255,255,.14)} .anim .cue-bar{fill:var(--lime)}
.stage{position:relative;overflow:hidden;border-radius:34px 28px 36px 30px/30px 36px 28px 34px;padding:6px 4px 2px;background:radial-gradient(70% 70% at 50% 45%,rgba(214,244,108,.16),rgba(255,255,255,.03) 70%);border:1px solid var(--line)}
.stage .anim{height:236px}
.thumb{width:64px;height:54px;border-radius:16px;background:radial-gradient(90% 90% at 50% 40%,rgba(214,244,108,.18),rgba(255,255,255,.04) 75%);border:1px solid var(--line);flex:none;display:grid;place-items:center;overflow:hidden}
.thumb .anim{width:62px;height:50px}

/* Atmosphère */
.bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0,#17301F,var(--ink) 70%)}
.blob{position:absolute;border-radius:46% 54% 58% 42%/48% 40% 60% 52%;filter:blur(64px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.b1{width:340px;height:340px;left:-90px;top:-40px;background:var(--lime);opacity:.3}
.b2{width:300px;height:300px;right:-100px;top:34%;background:var(--aqua);opacity:.24;animation-duration:27s;animation-delay:-8s}
.b3{width:320px;height:320px;left:10%;bottom:-120px;background:var(--peach);opacity:.26;animation-duration:31s;animation-delay:-14s}
@keyframes drift{0%{transform:translate(0,0) rotate(0) scale(1)}50%{transform:translate(40px,60px) rotate(40deg) scale(1.15)}100%{transform:translate(-30px,20px) rotate(-30deg) scale(.95)}}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* Structure */
#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 130px);-webkit-overflow-scrolling:touch}
#app::-webkit-scrollbar{display:none}
#view{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.rise{animation:rise .7s var(--ease) backwards;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}

/* Verre liquide */
.glass{position:relative;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 28px rgba(255,255,255,.04),0 24px 50px -24px rgba(0,0,0,.7)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(90% 60% at 18% -10%,rgba(255,255,255,.22),transparent 60%)}
.card{border-radius:36px 30px 38px 32px/32px 38px 30px 36px;padding:18px}
.halo::before{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0 50%,var(--lime) 72%,var(--aqua) 88%,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 7s linear infinite}
@keyframes spin{to{--a:360deg}}

/* Typo */
.h1{font-size:40px;line-height:1;font-weight:650}
.h2{font-size:25px;line-height:1.1}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.mute{color:var(--mute)} .small{font-size:13px} .num{font-family:var(--display);font-variation-settings:"SOFT" 100;font-variant-numeric:tabular-nums;font-weight:650}
.row{display:flex;align-items:center;gap:12px} .between{justify-content:space-between} .col{display:flex;flex-direction:column;gap:10px} .grow{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:6px 4px 0}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:26px 22px 28px 24px;font-weight:700;color:#0B140E;text-align:center;
  background:linear-gradient(180deg,#E6FA8E,var(--lime));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 10px 28px -8px rgba(214,244,108,.55);transition:transform .35s var(--spring),box-shadow .3s}
.btn:active{transform:scale(.94)}
.btn.ghost{color:var(--text);background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:19px}
.btn.block{width:100%}
.ibtn{width:44px;height:44px;border-radius:22px;display:inline-grid;place-items:center;flex:none;transition:transform .3s var(--spring)} .ibtn:active{transform:scale(.88)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 15px;border-radius:19px;flex:none;font-weight:600;font-size:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);transition:all .3s var(--ease)}
.chip.on{background:var(--lime);color:#0B140E;border-color:transparent;box-shadow:0 8px 22px -8px rgba(214,244,108,.6)}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px} .scrollx::-webkit-scrollbar{display:none}
.field{width:100%;height:52px;border-radius:26px;border:1px solid var(--line);background:rgba(255,255,255,.07);padding:0 20px;outline:none;font-size:16px}
.field:focus{border-color:var(--lime);box-shadow:0 0 0 4px rgba(214,244,108,.15)}

/* Anneaux */
.ring{transform:rotate(-90deg)} .ring circle{fill:none;stroke-linecap:round;stroke-width:11}
.ring .tr{stroke:rgba(255,255,255,.1)} .ring .pg{stroke-dasharray:var(--c);stroke-dashoffset:var(--o);animation:ringin 1.4s var(--ease) backwards;filter:drop-shadow(0 0 6px currentColor)}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}

/* Plats */
.plate{display:block;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden}
.plate svg,.plate img{width:100%;height:100%;display:block;object-fit:cover}
.dish{border-radius:32px 26px 34px 28px/28px 34px 26px 32px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;transition:transform .4s var(--spring);width:100%}
.dish:active{transform:scale(.95)}
.dish .plate{border-radius:26px;aspect-ratio:1.05;padding:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.macro{display:flex;gap:10px;font-size:13px;color:var(--mute)} .macro b{color:var(--text);font-weight:700}

/* Deck */
.deck{position:relative;height:420px;touch-action:pan-y}
.dcard{position:absolute;inset:0;border-radius:44px 36px 46px 38px/38px 46px 36px 44px;overflow:hidden;display:flex;flex-direction:column;will-change:transform;transition:transform .5s var(--spring)}
.dcard.next{transform:scale(.93) translateY(18px);opacity:.7;pointer-events:none}
.dcard .art{flex:1;display:grid;place-items:center;padding:18px 18px 0}
.dcard .art .plate{max-width:260px}
.dcard .info{padding:14px 20px 20px;position:relative;z-index:2}
.stamp{position:absolute;top:22px;padding:6px 14px;border-radius:14px;font-weight:800;letter-spacing:.1em;font-size:14px;opacity:0;border:2px solid;z-index:3}
.stamp.k{left:20px;color:var(--lime);transform:rotate(-12deg)} .stamp.s{right:20px;color:var(--peach);transform:rotate(12deg)}

/* Barre d'onglets */
#nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);width:min(440px,calc(100% - 28px));height:72px;border-radius:40px;display:flex;padding:6px;z-index:20;
  background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid var(--line);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 20px 50px -10px rgba(0,0,0,.75)}
#nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:34px;background:linear-gradient(160deg,rgba(214,244,108,.34),rgba(98,227,207,.16));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 24px rgba(214,244,108,.25);transition:transform .55s var(--spring)}
#nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--mute);transition:color .3s,transform .35s var(--spring)}
#nav button.on{color:var(--lime)} #nav button:active{transform:scale(.9)}

/* Feuilles */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,8,6,.55);backdrop-filter:blur(6px);animation:fade .3s}
.sheet-wrap[hidden],#runner[hidden]{display:none}
.sheet{width:min(520px,100%);max-height:92%;overflow-y:auto;scrollbar-width:none;border-radius:44px 44px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 28px);animation:up .55s var(--ease);
  background:linear-gradient(170deg,rgba(40,62,48,.92),rgba(14,24,18,.96));border:1px solid var(--line);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3)}
.sheet::-webkit-scrollbar{display:none}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:6px auto 14px}
@keyframes up{from{transform:translateY(100%)}} @keyframes fade{from{opacity:0}}
#runner{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 70% at 50% 0,#1C3A25,#07100A 70%);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 24px);animation:fade .4s}
#runner .in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-140%);z-index:70;padding:12px 20px;border-radius:24px;font-weight:600;font-size:14px;transition:transform .5s var(--spring);background:rgba(20,34,26,.9);border:1px solid var(--line);backdrop-filter:blur(20px)}
#toast.on{transform:translate(-50%,0)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .v{min-width:82px;text-align:center}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden} .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--aqua),var(--lime));transition:width .8s var(--ease)}
.dot{width:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.2);transition:all .4s var(--spring)} .dot.d{background:var(--lime);box-shadow:0 0 12px var(--lime)} .dot.c{width:30px;background:rgba(255,255,255,.7)}
.msg{max-width:88%;padding:13px 16px;border-radius:24px 24px 24px 8px;background:rgba(255,255,255,.1);border:1px solid var(--line);animation:rise .5s var(--ease)}
.msg.me{align-self:flex-end;border-radius:24px 24px 8px 24px;background:linear-gradient(180deg,#E6FA8E,var(--lime));color:#0B140E;font-weight:600;border:0}
.hr{height:1px;background:var(--line);margin:4px 0}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;background:rgba(214,244,108,.16);color:var(--lime)} .tag.w{background:rgba(255,158,120,.18);color:var(--peach)}
input[type=file]{display:none}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;flex:none;transition:all .3s var(--spring)} .chk.on{background:var(--lime);border-color:var(--lime);color:#0B140E}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (min-width:700px){#view{max-width:560px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gBody" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6f8f4"/><stop offset="1" stop-color="#b8c0b5"/></linearGradient>
<linearGradient id="gFar" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6c766b"/><stop offset="1" stop-color="#454c44"/></linearGradient>
<linearGradient id="gMus" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#dcff85"/><stop offset="1" stop-color="#93d21f"/></linearGradient>
<linearGradient id="gPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5d665c"/><stop offset=".5" stop-color="#3a4139"/><stop offset="1" stop-color="#20251f"/></linearGradient>
<radialGradient id="gShadow"><stop offset="0" stop-color="#000" stop-opacity=".65"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs></svg>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div class="grain"></div></div>
<main id="app"><div id="view"></div></main>
<nav id="nav" aria-label="Navigation principale"></nav>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="runner" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="anim.js"></script>
<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
