<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-title" content="Transformation">
<meta name="theme-color" content="#0a0c0a">
<title>Transformation</title>
<style>
@font-face { font-family: 'Lexend'; font-weight: 400; font-display: swap; src: url(fonts/lexend-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Lexend'; font-weight: 500; font-display: swap; src: url(fonts/lexend-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Lexend'; font-weight: 600; font-display: swap; src: url(fonts/lexend-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Lexend'; font-weight: 700; font-display: swap; src: url(fonts/lexend-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Lexend'; font-weight: 800; font-display: swap; src: url(fonts/lexend-latin-800-normal.woff2) format('woff2'); }
@font-face { font-family: 'Unbounded'; font-weight: 600; font-display: swap; src: url(fonts/unbounded-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Unbounded'; font-weight: 700; font-display: swap; src: url(fonts/unbounded-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Unbounded'; font-weight: 800; font-display: swap; src: url(fonts/unbounded-latin-800-normal.woff2) format('woff2'); }
:root {
  /* Direction : noir profond, une seule couleur vive (vert fluo) pour l'action, l'élément actif et le chiffre qui compte.
     Layout : une colonne mobile, marges de 20 px, barre du bas flottante à 4 onglets ; la séance s'ouvre en plein écran. */
  --bg: #0a0c0a;
  --card: #141714;
  --card-2: #1d211d;
  --line: #262b26;
  --ink: #f4f7f2;
  --ink-2: #a3aba2;
  --ink-3: #7f877e;
  --lime: #b5f23d;
  --lime-ink: #0a0c0a;
  --lime-soft: rgba(181, 242, 61, 0.12);
  --lime-glow: 0 0 0 1px rgba(181, 242, 61, 0.35), 0 8px 28px rgba(181, 242, 61, 0.18);
  --red: #e5484d;
  --m-p: #3987e5;
  --m-c: #d95926;
  --m-f: #9085e9;
  --font: 'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display: 'Unbounded', 'Lexend', system-ui, sans-serif;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --r-hero: 24px;
  --r-card: 20px;
  --r-ctl: 14px;
  --nav-h: 68px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.12; text-wrap: balance; letter-spacing: -0.01em; }
h1, .t-giant, .t-num, .tile .v, .head h1, .disp { font-family: var(--display); letter-spacing: -0.02em; }
.run-body h1.t-title { font-family: inherit; font-weight: 800; font-size: 28px; letter-spacing: -0.025em; }
.sheet h2 { letter-spacing: -0.02em; font-weight: 800; }
.t-giant { font-size: 68px; font-weight: 800; line-height: 0.95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.t-num { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.t-title { font-size: 27px; font-weight: 700; line-height: 1.15; }
.head h1, .done-hero h1 { font-family: var(--display); }
.t-card { font-size: 19px; font-weight: 600; }
.t-body { font-size: 16px; }
.t-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.t-mute { color: var(--ink-2); }
.lime { color: var(--lime); }
.unit { font-size: 0.42em; font-weight: 600; color: var(--ink-2); letter-spacing: 0; margin-left: 4px; }

#app { min-height: 100%; padding: 0 0 calc(var(--nav-h) + 36px); }
.page { max-width: 560px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 20px 0; display: grid; gap: 24px; }
.stack { display: grid; gap: 12px; }
.stack-s { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { font-size: 19px; font-weight: 600; }
.link { background: none; border: 0; padding: 4px 0; color: var(--lime); font-size: 13px; font-weight: 600; }

/* En-tête d'écran */
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 6px; }
.head h1 { font-size: 28px; font-weight: 700; }
.head p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
.ibtn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: inline-grid; place-items: center; padding: 0; flex: none; color: var(--ink); }
.ibtn svg { width: 21px; height: 21px; }
.ibtn.sm { width: 40px; height: 40px; }

/* Icônes */
.ic { width: 20px; height: 20px; flex: none; }
.ic-sq { width: 44px; height: 44px; border-radius: 14px; background: var(--card-2); display: grid; place-items: center; flex: none; color: var(--ink); }
.ic-sq svg { width: 21px; height: 21px; }
.ic-sq.on { background: var(--lime-soft); color: var(--lime); box-shadow: 0 0 0 1px rgba(181, 242, 61, 0.35); }

/* Cartes */
.card { background: var(--card); border-radius: var(--r-card); padding: 18px; display: grid; gap: 14px; }
.hero { background: var(--card); border-radius: var(--r-hero); padding: 20px; display: grid; gap: 16px; position: relative; overflow: hidden; }
.hero > * { position: relative; }
.hero > .hero-em, .hero > .glow { position: absolute; }
.card-lime { background: var(--lime); color: var(--lime-ink); border-radius: var(--r-hero); padding: 20px; display: grid; gap: 12px; position: relative; overflow: hidden; }
.card-lime .t-label { color: rgba(10, 12, 10, 0.7); }
.card-lime .bar { background: rgba(10, 12, 10, 0.16); }
.card-lime .bar i { background: var(--lime-ink); }
.card-lime .big-em { position: absolute; right: 12px; top: 14px; width: 64px; height: 64px; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.25)); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: var(--card-2); font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.pill.lime { background: var(--lime-soft); color: var(--lime); }
.pill svg { width: 15px; height: 15px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }

/* Boutons */
.btn { border: 0; border-radius: var(--r-ctl); min-height: 52px; padding: 0 20px; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--card-2); color: var(--ink); text-decoration: none; }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--lime); color: var(--lime-ink); }
.btn.primary:active { transform: scale(0.98); }
.btn.block { width: 100%; }
.btn.xl { min-height: 62px; font-size: 18px; font-weight: 700; border-radius: 18px; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.outline { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: rgba(229, 72, 77, 0.14); color: #ff8a8d; }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn:disabled { opacity: 0.45; }

/* Semaine */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 8px; }
.wd .l { font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.wd .c { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--card-2); color: var(--ink-2); }
.wd .c.plan { background: transparent; border: 1.5px dashed #3a413a; color: var(--ink); }
.wd .c.done { background: var(--lime); color: var(--lime-ink); }
.wd .c.done svg { width: 18px; height: 18px; }
.wd .c.miss { color: var(--ink-3); background: transparent; border: 1.5px solid var(--line); }
.wd.today .l { color: var(--lime); }
.wd.today .c { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--lime); }

/* Tuiles chiffre */
.tile { background: var(--card); border-radius: var(--r-card); padding: 16px; display: grid; gap: 6px; text-align: left; border: 0; color: inherit; }
.tile .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .v .unit { font-size: 15px; }
.tile .top { display: flex; align-items: center; justify-content: space-between; color: var(--ink-2); }
.tile .top svg { width: 18px; height: 18px; }
.trend { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 600; }
.trend svg { width: 16px; height: 16px; }
.trend.up { color: var(--lime); }
.trend.flat { color: var(--ink-2); }

/* Carrousel */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 78%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px; padding: 0 20px 4px; scroll-padding-inline: 20px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; }
.scard { background: var(--card); border-radius: var(--r-card); overflow: hidden; display: grid; border: 0; padding: 0; text-align: left; color: inherit; }
.scard .vis { background: radial-gradient(120% 90% at 70% 30%, #1f281a 0%, var(--card-2) 60%); height: 132px; display: grid; place-items: center; }
.scard .vis .anim { height: 124px; width: auto; }
.scard .body { padding: 14px 16px 16px; display: grid; gap: 6px; }

/* Illustrations */
.anim { display: block; width: 100%; height: auto; }
.anim .bn { fill: url(#gBody); }
.anim .bf { fill: url(#gFar); }
.anim .mn { fill: url(#gMus); filter: drop-shadow(0 0 4px rgba(181, 242, 61, 0.45)); }
.anim .mf { fill: #5f8a1c; }
.anim .dbp { fill: url(#gPlate); }
.anim .dbh { fill: #d9ded7; }
.anim .prop rect, .anim .prop circle { fill: #262c26; }
.anim .shadow { fill: url(#gShadow); }
.anim .ghost { opacity: 0.13; }
.anim .ghost path, .anim .ghost circle { fill: #e8f5d2; filter: none; }
.anim .cue { fill: var(--lime); font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; }
.anim .cue-trk { fill: rgba(255,255,255,0.12); }
.anim .cue-bar { fill: var(--lime); }
.em { display: block; width: 44px; height: 44px; object-fit: contain; flex: none; }
.em.s { width: 30px; height: 30px; }
.em.m { width: 56px; height: 56px; }
.em.l { width: 96px; height: 96px; }
.em.xl { width: 150px; height: 150px; filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.5)); }
.hero .hero-em { position: absolute; right: 8px; top: 10px; width: 120px; height: 120px; filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.55)); pointer-events: none; }
.hero .glow { position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(181, 242, 61, 0.22) 0%, rgba(181, 242, 61, 0) 65%); pointer-events: none; }
.stage { background: radial-gradient(70% 70% at 50% 45%, #22301a 0%, #141914 70%); border-radius: var(--r-card); padding: 12px 10px 6px; border: 1px solid #1f261f; position: relative; overflow: hidden; }
.stage::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.25)); pointer-events: none; }
.stage { padding: 6px 4px 2px; }
.stage .anim { height: 236px; }
.thumb { width: 64px; height: 54px; border-radius: 14px; background: radial-gradient(90% 90% at 50% 40%, #222b1c 0%, var(--card-2) 75%); flex: none; display: grid; place-items: center; overflow: hidden; }
.thumb .anim { width: 62px; height: 50px; }
.bodymap { width: 100%; max-width: 300px; display: block; margin: 0 auto; }
.bodymap .m-base { fill: #2a302a; }
.bodymap .m-off { fill: #343b34; }
.bodymap .m-on { fill: var(--lime); }
.bodymap text { fill: var(--ink-3); font: 600 11px var(--font); }

/* Listes */
.list { background: var(--card); border-radius: var(--r-card); padding: 4px 16px; }
.li { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; text-align: left; }
.li:first-child { border-top: 0; }
.li .tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.li .tx b { font-weight: 600; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; }
.li .tx span { font-size: 13px; color: var(--ink-2); }
.li .end { color: var(--ink-2); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.li .end svg { width: 18px; height: 18px; color: var(--ink-3); }
.li.danger .tx b { color: #ff8a8d; }
.li.danger .ic-sq { background: rgba(229, 72, 77, 0.14); color: #ff8a8d; }
.avatar { width: 44px; height: 44px; border-radius: 14px; background: var(--card-2); display: grid; place-items: center; font-weight: 700; color: var(--lime); flex: none; font-size: 16px; }

/* Onglets en pilule */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 14px; height: 40px; border-radius: 999px; }
.seg button.on { background: var(--lime); color: var(--lime-ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; }
.chip.on { background: var(--lime-soft); border-color: var(--lime); color: var(--lime); }

/* Barre du bas flottante */
.nav { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); height: var(--nav-h); max-width: 536px; margin: 0 auto; background: rgba(20, 23, 20, 0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 24px; display: grid; grid-template-columns: repeat(4, 1fr); z-index: 20; }
.nav button { border: 0; background: none; color: var(--ink-3); display: grid; place-items: center; align-content: center; gap: 4px; font-size: 12.5px; font-weight: 600; position: relative; }
.nav button svg { width: 24px; height: 24px; }
.nav button.on { color: var(--lime); }
.nav button.on::after { content: ''; position: absolute; bottom: 7px; width: 22px; height: 3px; border-radius: 3px; background: var(--lime); }
.nav button.on span { opacity: 0; }
.fab { position: fixed; right: 20px; bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); width: 60px; height: 60px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); border: 0; display: grid; place-items: center; box-shadow: var(--lime-glow); z-index: 19; }
.fab svg { width: 28px; height: 28px; }

/* Barres de progression */
.bar { height: 8px; border-radius: 99px; background: var(--card-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--lime); transition: width 0.3s; }

/* Séance plein écran */
#run { position: fixed; inset: 0; background: var(--bg); z-index: 30; overflow-y: auto; display: none; -webkit-overflow-scrolling: touch; }
#run.open { display: block; }
.run-top { position: sticky; top: 0; z-index: 2; background: rgba(10, 12, 10, 0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: calc(12px + env(safe-area-inset-top)) 20px 12px; display: grid; gap: 12px; }
.run-top .ttl { text-align: center; display: grid; gap: 2px; }
.run-top .ttl b { font-size: 17px; font-weight: 700; }
.run-top .ttl span { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.segbar { display: grid; grid-auto-flow: column; gap: 4px; }
.segbar i { height: 5px; border-radius: 5px; background: var(--card-2); }
.segbar i.done { background: var(--lime); }
.segbar i.cur { background: rgba(181, 242, 61, 0.45); }
.run-body { max-width: 560px; margin: 0 auto; padding: 8px 20px 40px; display: grid; gap: 18px; }
.target { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.target .x { font-size: 40px; font-weight: 700; color: var(--ink-3); }
.next { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 18px; padding: 10px 14px 10px 10px; }
.rest { display: grid; justify-items: center; gap: 22px; padding-top: 12px; text-align: center; }
.ring { position: relative; width: 250px; height: 250px; }
.ring svg { width: 250px; height: 250px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 14; }
.ring .trk { stroke: var(--card-2); }
.ring .val { stroke: var(--lime); stroke-linecap: round; transition: stroke-dashoffset 0.25s linear; filter: drop-shadow(0 0 10px rgba(181, 242, 61, 0.35)); }
.ring .ctr { position: absolute; inset: 0; display: grid; place-content: center; gap: 4px; }
.hero3d { display: block; }
.done-hero { text-align: center; display: grid; gap: 10px; justify-items: center; padding-top: 8px; }


/* Séries */
.sets { display: flex; gap: 8px; flex-wrap: wrap; }
.set { min-width: 52px; height: 52px; border-radius: 16px; border: 0; background: var(--card-2); color: var(--ink); display: inline-grid; place-items: center; align-content: center; padding: 0 10px; font-size: 15px; font-weight: 700; line-height: 1.1; }
.set small { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.set.done { background: var(--lime); color: var(--lime-ink); }
.set.done small { color: rgba(10, 12, 10, 0.65); }
.set.cur { box-shadow: inset 0 0 0 2px var(--lime); }
.set svg { width: 18px; height: 18px; }

/* Panneaux */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.66); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
.scrim.open { display: flex; }
.sheet { background: #111411; border-radius: 28px 28px 0 0; width: 100%; max-width: 560px; max-height: calc(100% - env(safe-area-inset-top) - 24px); overflow-y: auto; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); display: grid; gap: 16px; border-top: 1px solid var(--line); }
.grab { width: 44px; height: 5px; border-radius: 99px; background: #3a413a; margin: 4px auto 4px; }
.sheet h2 { font-size: 21px; font-weight: 700; line-height: 1.2; }
.stepper { display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; gap: 10px; background: var(--card); border-radius: 18px; padding: 6px; }
.stepper button { height: 56px; border-radius: 14px; border: 0; background: var(--card-2); display: grid; place-items: center; }
.stepper button svg { width: 24px; height: 24px; }
.stepper .val { text-align: center; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 8px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input { width: 100%; height: 52px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 0 16px; font-size: 16px; }
.input:focus { outline: none; border-color: var(--lime); }
.search { position: relative; }
.search svg { position: absolute; left: 16px; top: 16px; width: 20px; height: 20px; color: var(--ink-3); }
.search .input { padding-left: 46px; }
.switch { width: 52px; height: 32px; border-radius: 99px; background: var(--card-2); border: 0; position: relative; flex: none; padding: 0; }
.switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink-3); transition: transform 0.2s, background 0.2s; }
.switch.on { background: var(--lime-soft); box-shadow: inset 0 0 0 1px var(--lime); }
.switch.on::after { transform: translateX(20px); background: var(--lime); }

/* Nutrition */
.ringbox { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.kring { position: relative; width: 140px; height: 140px; }
.kring svg { width: 140px; height: 140px; transform: rotate(-90deg); }
.kring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
.kring .ctr { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.mrings { display: grid; gap: 12px; }
.mring { display: flex; align-items: center; gap: 12px; }
.mring svg { width: 38px; height: 38px; transform: rotate(-90deg); flex: none; }
.mring circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.mring b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mring .lab { font-size: 12.5px; color: var(--ink-2); display: block; }
.mring b .t-label { font-weight: 500; }
.meal-head { display: flex; align-items: center; gap: 12px; }
.food-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; text-align: left; }
.food-row .tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.food-row .tx b { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.food-row .tx span { font-size: 13px; color: var(--ink-2); }
.kc { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kc small { font-weight: 500; color: var(--ink-2); font-size: 12px; }
.tag { font-size: 11.5px; font-weight: 700; color: var(--lime); background: var(--lime-soft); border-radius: 6px; padding: 2px 6px; vertical-align: middle; }
.results { display: grid; }
.group-label { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 14px 0 2px; }
.skel { height: 54px; border-radius: 14px; background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%); background-size: 200% 100%; animation: sk 1.2s infinite linear; margin-top: 8px; }
@keyframes sk { to { background-position: -200% 0; } }

/* Graphiques */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--ink-3); font-size: 11px; font-family: var(--font); }
.chart .line { fill: none; stroke: var(--lime); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .bar { fill: var(--lime); }
.chart .bar.dim { fill: #2f3a24; }
.chart .goal { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .dot { fill: var(--lime); stroke: var(--card); stroke-width: 3; }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 5px 9px; font-size: 12.5px; white-space: nowrap; transform: translateX(-50%); display: none; }
.empty { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 18px 8px; color: var(--ink-2); font-size: 14px; }
.empty svg { width: 30px; height: 30px; color: var(--ink-3); }

/* Photos */
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ph { aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; background: var(--card-2); position: relative; border: 0; padding: 0; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph span { position: absolute; left: 6px; bottom: 6px; font-size: 11.5px; font-weight: 600; background: rgba(0, 0, 0, 0.6); padding: 2px 7px; border-radius: 7px; }
.ph.sel { box-shadow: inset 0 0 0 3px var(--lime); }
.cmp { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 3 / 4; background: var(--card-2); touch-action: none; }
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cmp .after { clip-path: inset(0 0 0 50%); }
.cmp .knob { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: var(--lime); transform: translateX(-50%); }
.cmp .knob::after { content: ''; position: absolute; top: 50%; left: 50%; width: 34px; height: 34px; border-radius: 50%; background: var(--lime); transform: translate(-50%, -50%); box-shadow: var(--lime-glow); }
.cmp .lbl { position: absolute; top: 10px; font-size: 12.5px; font-weight: 600; background: rgba(0, 0, 0, 0.6); padding: 3px 9px; border-radius: 8px; }

/* Première ouverture */

.onb { min-height: 100vh; max-width: 560px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom)); display: grid; grid-template-rows: auto 1fr auto; gap: 24px; }
.onb .dots { display: flex; gap: 6px; }
.onb .dots i { height: 5px; flex: 1; border-radius: 5px; background: var(--card-2); }
.onb .dots i.on { background: var(--lime); }
.onb .mid { display: grid; align-content: center; gap: 18px; }
.onb .em.xl { justify-self: start; }
.daypick { display: grid; gap: 10px; }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); box-shadow: 0 10px 30px rgba(0,0,0,.5); transform: translateX(-50%); background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; z-index: 60; font-size: 14px; font-weight: 500; max-width: calc(100% - 40px); display: none; }
.toast.open { display: block; animation: toastIn .28s var(--ease-out); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px); } }
.card-lime > .big-em ~ div { padding-right: 64px; }
.intens { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; padding: 10px 12px; border-radius: 14px; background: var(--card); font-size: 14px; color: var(--ink-2); line-height: 1.4; }
.intens svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--ink-3); }
.intens.max { background: rgba(181, 242, 61, 0.1); border: 1px solid rgba(181, 242, 61, 0.35); color: var(--ink); }
.intens.max svg { color: var(--lime); }
.intens b { color: var(--lime); }
.delta { background: var(--card-2); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; }
.delta b { font-family: var(--display); font-size: 22px; letter-spacing: -0.02em; }
.delta.up b { color: var(--lime); }
.delta span { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 8px; height: 14px; border-radius: 2px; opacity: 0; animation: fall 2.4s cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes fall { 0% { opacity: 1; transform: translateY(0) rotate(0); } 100% { opacity: 0; transform: translateY(105vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
.cues { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cues li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: var(--ink-2); }
.cues li svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.wd .l { display: grid; justify-items: center; gap: 2px; }
.wd .l small { font-size: 11px; font-weight: 500; color: var(--ink-3); }
.wd .c.rest { background: transparent; }
.wd .c.rest i { width: 6px; height: 6px; border-radius: 50%; background: #3a413a; }
.tile .v.rec { font-size: 26px; display: block; white-space: nowrap; }
.tile .v.rec small { display: block; margin-top: 6px; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; white-space: normal; }
.bm-wrap .bodymap { max-width: 230px; margin: 0 auto; display: block; }
.strip { display: flex; gap: 10px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 6px; scroll-padding-inline: 20px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip-it { flex: none; width: 128px; display: grid; gap: 8px; text-align: left; scroll-snap-align: start; background: none; border: 0; padding: 0; color: var(--ink); font: inherit; }
.strip-it .sv { height: 104px; border-radius: 18px; background: radial-gradient(90% 90% at 50% 35%, #24301c 0%, var(--card) 75%); border: 1px solid #1f261f; display: grid; place-items: center; overflow: hidden; }
.strip-it .sv .anim { width: 124px; height: 99px; }
.strip-it span { font-size: 13px; font-weight: 600; line-height: 1.25; color: var(--ink-2); }
.note { font-size: 13px; color: var(--ink-2); margin: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes sheetIn { from { transform: translateY(40px); opacity: 0.4; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
.page > *, .run-body > * { animation: rise 0.38s var(--ease-out) both; }
.page > *:nth-child(2) { animation-delay: 0.03s; } .page > *:nth-child(3) { animation-delay: 0.06s; } .page > *:nth-child(4) { animation-delay: 0.09s; } .page > *:nth-child(5) { animation-delay: 0.12s; } .page > *:nth-child(n+6) { animation-delay: 0.15s; }
.scrim.open .sheet { animation: sheetIn 0.32s var(--ease-out) both; }
.pop { animation: pop 0.5s var(--ease-out) both; }
.btn, .tile, .scard, .li, .chip, .set, .ibtn, .food-row { transition: transform 0.12s var(--ease-out), background 0.2s; }
.btn:active, .tile:active, .scard:active, .li:active, .chip:active, .set:active, .ibtn:active, .food-row:active { transform: scale(0.97); }
.phase-rest .ring .val { stroke: #6b7c66; filter: none; }
.phase-label { font-family: var(--display); font-size: 22px; font-weight: 700; }
.phase-label.work { color: var(--lime); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
